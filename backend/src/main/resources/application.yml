spring:
  application:
    name: futuremeal-backend
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/futuremeal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        use_sql_comments: false
        enable_lazy_load_no_trans: false
    open-in-view: false
  
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:futuremeal-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: ${JWT_EXPIRATION:86400000}       # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# App configuration
app:
  name: FutureMeal
  version: 1.0.0
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  
  # AI Service configuration
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:none}  # Options: openai, gemini, none
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    max-tokens: 500
  
  # FutureMeal engine config
  futuremeal:
    evaluation-window-minutes: 30      # How many minutes before planned time to evaluate
    score-weights:
      budget-match: 0.30
      availability: 0.20
      distance: 0.15
      delivery-time: 0.15
      rating: 0.10
      preference-match: 0.10
  
  # Payment gateway (configure for live payments)
  payment:
    gateway: ${PAYMENT_GATEWAY:none}   # Options: razorpay, paytm, none
    key-id: ${PAYMENT_KEY_ID:}
    key-secret: ${PAYMENT_KEY_SECRET:}
  
  # Seed data
  seed:
    enabled: ${SEED_DATA_ENABLED:true}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

# Logging
logging:
  level:
    com.futuremeal: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: WARN
    org.springframework.web: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
